<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkValue Calculator</title>

  <style>
    :root {
      --bg: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 480px;
      padding: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WorkValue Calculator</h1>
    <p>A tool to calculate the real hourly value of your work.</p>

    <div class="status">Site under construction</div>

    <footer>
      Coming soon
    </footer>
  </div>
</body>
</html>
